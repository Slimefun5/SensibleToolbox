# Per-item balance scores (0-100) for SensibleToolbox, relative to vanilla Minecraft.
# Read by Slimefun's BalanceService (overrides the auto heuristic). Bands:
#   0-10 Trivial | 11-25 Standard | 26-40 Advanced | 41-69 Powerful | 70-100 Overpowered
#   (vanilla anchors: iron gear ~15, netherite ~30, beacon ~35, end crystal ~70, mace ~85)
# Scores derived from actual item stats read from src/main/java (energy, throughput,
# range, capacity, area-of-effect, abilities) - not id guessing. SensibleToolbox is a
# tech/automation addon: its ceiling is powerful logistics infrastructure, so nothing
# reaches the game-changing 70+ band reserved for end-crystal/mace-class items.
