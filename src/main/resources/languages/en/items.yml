# English item translations for SensibleToolbox. Keyed by Slimefun item id (STB_<ITEM>).
# Block-lore format: name + type/description/stats/usage blocks, composed by LoreComposer.

STB_ANGELICBLOCK:
  name: 'Angelic Block'
  type:
    - "&7&oGadget"
  description:
    - "&7A temporary floating scaffold block,"
    - "&7ideal for building out into open space."
  usage:
    - "&eRight Click&7 to place the block in the air"
    - "&eLeft Click&7 the block to insta-break it"
STB_AUTOBUILDER:
  name: 'Auto Builder'
  type:
    - "&7&oMachine"
  description:
    - "&7Can build or clear an area."
    - "&7Use Land Markers to define the area."
STB_AUTOFARM:
