  type:
    - "&7&oGadget"
  description:
    - "&7A temporary floating scaffold block,"
    - "&7ideal for building out into open space."
  usage:
    - "&eRight Click&7 to place the block in the air"
    - "&eLeft Click&7 the block to insta-break it"
STB_AUTOBUILDER:
  name: "&fAuto Builder"
  type:
    - "&7&oMachine"
  description:
    - "&7Can build or clear an area."
