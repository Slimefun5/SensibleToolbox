  - '&7Past in een itemrouter om items te sturen'
  - '&7naar een aangrenzende inventaris, of naar een router'
  - '&7met een Ontvangermodule binnen 10 blokken'
  - '&7met zichtlijn.'
  name: '&fI.R. Mod: Zender'
  type:
  - '&7&oOnderdeel'
  usage:
  - '&eLinksklik&7 op een blok om de richting in te stellen'
  - '&eSluipen + Linksklik&7 in de lucht om de richting te wissen'
STB_SILICONWAFER:
  description:
  - '&7Gebruikt bij de fabricage van geavanceerdere'
  - '&7elektronische circuits.'
  name: '&fSilicium-Wafer'
  type:
  - '&7&oOnderdeel'
STB_SILKYBREAKERMODULE:
  description:
  - '&7Wint met Zijden Aanraking het blok in de ingestelde'
  - '&7richting en trekt het in de router.'
  - '&7Moet vervaardigd worden met een boek met Zijden Aanraking.'
  name: '&fI.R. Mod: Zijdezachte breker'
  type:
  - '&7&oOnderdeel'
  usage:
  - '&eLinksklik&7 op een blok om de richting in te stellen'
  - '&eSluipen + Linksklik&7 in de lucht om de richting te wissen'
STB_SIMPLECIRCUIT:
  description:
  - '&7Gebruikt als component in diverse machines.'
  name: '&fEenvoudig elektronisch circuit'
  type:
  - '&7&oOnderdeel'
STB_SMELTER:
  description:
  - '&7Smelt items zoals een oven, maar'
  - '&7sneller en efficiënter.'
  name: '&fSmelter'
  type:
  - '&7&oMachine'
STB_SORTERMODULE:
  description:
  - '&7Past in een itemrouter om items te plaatsen'
  - '&7in een inventaris, alleen als die leeg is of'
  - '&7dat item al bevat.'
  name: '&fI.R. Mod: Sorteerder'
  type:
  - '&7&oOnderdeel'
  usage:
  - '&eLinksklik&7 op een blok om de richting in te stellen'
  - '&eSluipen + Linksklik&7 in de lucht om de richting te wissen'
STB_SOUNDMUFFLER:
  description:
  - '&7Vermindert het volume van alle geluiden'
  - '&7binnen een straal van 8 blokken.'
  name: '&fGeluiddemper'
  type:
  - '&7&oMachine'
  usage:
  - '&eRechtsklik&7 om de instellingen te openen'
STB_SPEEDMODULE:
  description:
  - '&7Een passieve module die de snelheid van de'
  - '&7router verhoogt. 0 modules = 1 bewerking / 20 ticks;'
  - '&71 = 1/15, 2 = 1/10, 3 = 1/5. Boven 3 genegeerd.'
  name: '&fI.R. Mod: Snelheidsupgrade'
  type:
  - '&7&oOnderdeel'
STB_SPEEDUPGRADE:
  description:
  - '&7Geplaatst in een machine om hem sneller te'
  - '&7laten draaien, ten koste van meer stroomverbruik.'
  name: '&fSnelheidsupgrade'
  stats:
  - '&8⇨ &7Snelheid: &ex1.4'
  - '&8⇨ &7Stroomverbruik: &ex1.6'
  type:
  - '&7&oOnderdeel'
STB_STACKMODULE:
  description:
  - '&7Een passieve module; elke module verdubbelt het'
  - '&7aantal items per bewerking, tot de maximale'
  - '&7stapelgrootte van het item. Boven 6 wordt genegeerd.'
  name: '&fI.R. Mod: Stapelupgrade'
  type:
  - '&7&oOnderdeel'
STB_SUBSPACETRANSPONDER:
  description:
  - '&7Gebruikt door sommige geavanceerde items voor'
  - '&7communicatie tussen werelden.'
  name: '&fSubruimte-transponder'
  type:
  - '&7&oOnderdeel'
STB_TAPEMEASURE:
  description:
  - '&7Meet de afstand tussen twee'
  - '&7punten die je in de wereld kiest.'
  name: '&fMeetlint'
  type:
  - '&7&oGereedschap'
  usage:
  - '&eSluipen + Rechtsklik&7 op een blok om het ankerpunt te zetten'
  - '&eRechtsklik&7 op een blok om de meting te krijgen'
STB_TENKBATTERYBOX:
  description:
  - '&7Slaat energie op om stroom te bufferen tussen'
  - '&7generatoren en machines.'
  name: '&f10K batterijbox'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oMachine'
STB_TENKENERGYCELL:
  description:
  - '&7Een draagbare energiecel die opgeslagen'
  - '&7STB-stroom meeneemt om onderweg apparaten op te laden.'
  name: '&f10K energiecel'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oOnderdeel'
STB_THOROUGHNESSUPGRADE:
  description:
  - '&7Geplaatst in een machine om de nuttige uitvoer te'
  - '&7verhogen, ten koste van snelheid en stroom.'
  name: '&fGrondigheidsupgrade'
  stats:
  - '&8⇨ &7Snelheid: &ex0.7'
  - '&8⇨ &7Stroomverbruik: &ex1.6'
  - '&8⇨ &7Bonusuitvoer: &e+8%'
  type:
  - '&7&oOnderdeel'
STB_TOUGHMACHINEFRAME:
  description:
  - '&7Gebruikt bij de fabricage van wat meer'
  - '&7geavanceerde machines.'
  name: '&fStevig machineframe'
  type:
  - '&7&oOnderdeel'
STB_TRASHCAN:
  description:
  - '&7VERNIETIGT alle items die erin geplaatst of'
  - '&7gepompt worden. Pas op!'
  name: '&fPrullenbak'
  type:
  - '&7&oMachine'
STB_UNLINKEDSCURELAY:
  description:
  - '&7Vervaardig er twee samen om ze te koppelen'
  - '&7tot een SCU-relais met gedeelde lading.'
  name: '&fNiet-gekoppeld SCU-relais'
  type:
  - '&7&oOnderdeel'
STB_VACUUMMODULE:
  description:
  - '&7Past in een itemrouter om nabijgelegen'
  - '&7gevallen items op te zuigen.'
  name: '&fI.R. Mod: Stofzuiger'
  stats:
  - '&8⇨ &7Straal: &e6 blokken'
  type:
  - '&7&oOnderdeel'
STB_WATERINGCAN:
  description:
  - '&7Bevloeit nabijgelegen gewassen en laat ze groeien.'
  - '&7Gebruik hem niet te vaak!'
  name: '&fGieter'
  type:
  - '&7&oGereedschap'
  usage:
  - '&eRechtsklik&7 om gewassen te bevloeien'
  - '&eRechtsklik&7 in water om bij te vullen'
STB_WOODCOMBINEHOE:
  description:
  - '&7Een multigereedschapsschoffel die omploegt, zaait en'
  - '&7oogst, met een ingebouwde zaadzak.'
  name: '&fHouten combinatieschoffel'
  type:
  - '&7&oGereedschap'
  usage:
  - '&eRechtsklik&7 op aarde/gras om een gebied van 3x3 om te ploegen'
  - '&eRechtsklik&7 op akkerland om een gebied van 3x3 in te zaaien'
  - '&eRechtsklik&7 elders om de zaadzak te openen'
  - '&eLinksklik&7 op planten om een gebied van 3x3 te oogsten'
  - '&eLinksklik&7 op bladeren om een gebied van 3x3x3 te breken'
