  - '&7Conecta-se a outro Relé SCU para compartilhar'
  - '&7uma carga comum a qualquer distância.'
  name: '&fRelé SCU'
  stats:
  - '&8⇨ &e⚡ &7100000 SCU'
  type:
  - '&7&oMáquina'
STB_SENDERMODULE:
  description:
  - '&7Encaixa em um Roteador de Itens para enviar itens'
  - '&7a um inventário adjacente, ou a um roteador'
  - '&7com um Módulo Receptor a até 10 blocos'
  - '&7com linha de visão.'
  name: '&fI.R. Mod: Emissor'
  type:
  - '&7&oComponente'
  usage:
  - '&eClique Esquerdo&7 em um bloco para definir a direção'
  - '&eAgachar + Clique Esquerdo&7 no ar para remover a direção'
STB_SILICONWAFER:
  description:
  - '&7Usado na fabricação de circuitos eletrônicos'
  - '&7mais avançados.'
  name: '&fWafer de Silício'
  type:
  - '&7&oComponente'
STB_SILKYBREAKERMODULE:
  description:
  - '&7Coleta com Toque Suave o bloco na sua direção'
  - '&7configurada e o puxa para dentro do roteador.'
  - '&7Deve ser fabricado com um livro de Toque Suave.'
  name: '&fI.R. Mod: Quebrador Sedoso'
  type:
  - '&7&oComponente'
  usage:
  - '&eClique Esquerdo&7 em um bloco para definir a direção'
  - '&eAgachar + Clique Esquerdo&7 no ar para remover a direção'
STB_SIMPLECIRCUIT:
  description:
  - '&7Usado como componente em diversas máquinas.'
  name: '&fCircuito Eletrônico Simples'
  type:
  - '&7&oComponente'
STB_SMELTER:
  description:
  - '&7Funde itens como uma Fornalha, porém'
  - '&7mais rápido e mais eficiente.'
  name: '&fFundidor'
  type:
  - '&7&oMáquina'
STB_SORTERMODULE:
  description:
  - '&7Encaixa em um Roteador de Itens para colocar itens'
  - '&7em um inventário apenas se ele estiver vazio ou'
  - '&7já contiver aquele item.'
  name: '&fI.R. Mod: Classificador'
  type:
  - '&7&oComponente'
  usage:
  - '&eClique Esquerdo&7 em um bloco para definir a direção'
  - '&eAgachar + Clique Esquerdo&7 no ar para remover a direção'
STB_SOUNDMUFFLER:
  description:
  - '&7Reduz o volume de todos os sons'
  - '&7em um raio de 8 blocos.'
  name: '&fAbafador de Som'
  type:
  - '&7&oMáquina'
  usage:
  - '&eClique Direito&7 para abrir a configuração'
STB_SPEEDMODULE:
  description:
  - '&7Um módulo passivo que aumenta a velocidade'
  - '&7do roteador. 0 módulos = 1 operação / 20 ticks;'
  - '&71 = 1/15, 2 = 1/10, 3 = 1/5. Acima de 3 é ignorado.'
  name: '&fI.R. Mod: Melhoria de Velocidade'
  type:
  - '&7&oComponente'
STB_SPEEDUPGRADE:
  description:
  - '&7Colocado em uma máquina para fazê-la funcionar'
  - '&7mais rápido, ao custo de maior consumo de energia.'
  name: '&fMelhoria de Velocidade'
  stats:
  - '&8⇨ &7Velocidade: &ex1.4'
  - '&8⇨ &7Consumo de Energia: &ex1.6'
  type:
  - '&7&oComponente'
STB_STACKMODULE:
  description:
  - '&7Um módulo passivo; cada um dobra a quantidade de'
  - '&7itens movidos por operação, até o limite da'
  - '&7pilha máxima do item. Acima de 6 são ignorados.'
  name: '&fI.R. Mod: Melhoria de Pilha'
  type:
  - '&7&oComponente'
STB_SUBSPACETRANSPONDER:
  description:
  - '&7Usado por alguns itens avançados para'
  - '&7comunicação entre mundos.'
  name: '&fTransponder de Subespaço'
  type:
  - '&7&oComponente'
STB_TAPEMEASURE:
  description:
  - '&7Mede a distância entre dois'
  - '&7pontos que você seleciona no mundo.'
  name: '&fFita Métrica'
  type:
  - '&7&oFerramenta'
  usage:
  - '&eAgachar + Clique Direito&7 em um bloco para definir a âncora'
  - '&eClique Direito&7 em um bloco para obter a medição'
STB_TENKBATTERYBOX:
  description:
  - '&7Armazena energia para servir de reserva entre'
  - '&7geradores e máquinas.'
  name: '&fCaixa de Baterias 10K'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oMáquina'
STB_TENKENERGYCELL:
  description:
  - '&7Uma célula de energia portátil que carrega energia'
  - '&7STB armazenada para carregar dispositivos em movimento.'
  name: '&fCélula de Energia 10K'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oComponente'
STB_THOROUGHNESSUPGRADE:
  description:
  - '&7Colocado em uma máquina para aumentar a saída'
  - '&7útil, ao custo de velocidade e energia.'
  name: '&fMelhoria de Minúcia'
  stats:
  - '&8⇨ &7Velocidade: &ex0.7'
  - '&8⇨ &7Consumo de Energia: &ex1.6'
  - '&8⇨ &7Saída Bônus: &e+8%'
  type:
  - '&7&oComponente'
STB_TOUGHMACHINEFRAME:
  description:
  - '&7Usado na fabricação de algumas máquinas'
  - '&7mais avançadas.'
  name: '&fEstrutura de Máquina Reforçada'
  type:
  - '&7&oComponente'
STB_TRASHCAN:
  description:
  - '&7DESTRÓI qualquer item colocado ou canalizado'
  - '&7para dentro dele. Cuidado!'
  name: '&fLixeira'
  type:
  - '&7&oMáquina'
STB_UNLINKEDSCURELAY:
  description:
  - '&7Fabrique um par destes juntos para vinculá-los'
  - '&7em um Relé SCU de carga compartilhada.'
  name: '&fRelé SCU Não Vinculado'
  type:
  - '&7&oComponente'
STB_VACUUMMODULE:
  description:
  - '&7Encaixa em um Roteador de Itens para sugar'
  - '&7itens caídos por perto.'
  name: '&fI.R. Mod: Aspirador'
  stats:
  - '&8⇨ &7Raio: &e6 blocos'
  type:
  - '&7&oComponente'
STB_WATERINGCAN:
  description:
  - '&7Irriga e faz crescer as plantações próximas.'
  - '&7Não abuse dele!'
  name: '&fRegador'
  type:
  - '&7&oFerramenta'
  usage:
  - '&eClique Direito&7 para irrigar as plantações'
  - '&eClique Direito&7 na água para reabastecer'
STB_WOODCOMBINEHOE:
  description:
  - '&7Uma enxada multiuso que ara, semeia e'
  - '&7colhe, com uma bolsa de sementes embutida.'
  name: '&fEnxada Combinada de Madeira'
  type:
  - '&7&oFerramenta'
  usage:
  - '&eClique Direito&7 em terra/grama para arar uma área 3x3'
  - '&eClique Direito&7 na terra arada para semear uma área 3x3'
  - '&eClique Direito&7 em outro lugar para abrir a bolsa de sementes'
  - '&eClique Esquerdo&7 em plantas para colher uma área 3x3'
  - '&eClique Esquerdo&7 em folhas para quebrar uma área 3x3x3'
