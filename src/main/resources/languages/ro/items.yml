  - '&7&oComponentă'
STB_TOUGHMACHINEFRAME:
  description:
  - '&7Folosit la fabricarea unor mașini mai'
  - '&7avansate.'
  name: '&fCadru de Mașină Rezistent'
  type:
  - '&7&oComponentă'
STB_TRASHCAN:
  description:
  - '&7DISTRUGE orice obiect plasat sau trimis'
