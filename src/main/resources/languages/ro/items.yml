  name: '&fCoș de Gunoi'
  type:
  - '&7&oMașină'
STB_UNLINKEDSCURELAY:
  description:
  - '&7Fabrică o pereche din acestea împreună pentru a le'
  - '&7lega într-un Releu SCU cu încărcare comună.'
