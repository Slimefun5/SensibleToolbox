  type:
  - '&7&oMașină'
  usage:
  - '&eClic dreapta&7 pentru a deschide configurarea'
STB_SPEEDMODULE:
  description:
  - '&7Un modul pasiv care crește viteza'
  - '&7routerului. 0 module = 1 operațiune / 20 tick-uri;'
  - '&71 = 1/15, 2 = 1/10, 3 = 1/5. Peste 3 sunt ignorate.'
  name: '&fR.O. Mod: Îmbunătățire de Viteză'
  type:
  - '&7&oComponentă'
STB_SPEEDUPGRADE:
  description:
  - '&7Plasată într-o mașină pentru a o face să'
  - '&7meargă mai repede, cu un consum mai mare de energie.'
