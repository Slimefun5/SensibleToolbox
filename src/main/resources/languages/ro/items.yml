  type:
  - '&7&oUnealtă'
  usage:
  - '&eClic dreapta&7 pe pământ/iarbă pentru a ara o zonă 3x3'
  - '&eClic dreapta&7 pe teren agricol pentru a semăna o zonă 3x3'
  - '&eClic dreapta&7 în altă parte pentru a deschide sacul de semințe'
  - '&eClic stânga&7 pe plante pentru a recolta o zonă 3x3'
  - '&eClic stânga&7 pe frunze pentru a sparge o zonă 3x3x3'
