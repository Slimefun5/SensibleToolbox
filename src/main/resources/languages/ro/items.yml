  stats:
  - '&8⇨ &7Viteză: &ex1.4'
  - '&8⇨ &7Consum de energie: &ex1.6'
  type:
  - '&7&oComponentă'
STB_STACKMODULE:
  description:
  - '&7Un modul pasiv; fiecare dublează'
  - '&7obiectele mutate pe operațiune, până la'
  - '&7stiva maximă a obiectului. Peste 6 sunt ignorate.'
