  - '&7Ceas într-un bloc. Emite un semnal'
  - '&7de redstone cu interval și durată configurabile.'
  name: '&fCeas de Redstone'
  type:
  - '&7&oMașină'
  usage:
  - '&eClic dreapta&7 pe bloc pentru a configura ceasul'
STB_REGULATORUPGRADE:
  description:
  - '&7Adaugă inteligență mașinilor pentru un consum'
  - '&7mai eficient de resurse. Efectul variază'
  - '&7după mașină.'
  name: '&fÎmbunătățire de Regulator'
  type:
  - '&7&oComponentă'
STB_SAWMILL:
  description:
  - '&7Procesează obiectele din lemn în scânduri'
  - '&7cu randament mai mare decât fabricarea.'
  name: '&fJoagăr'
  type:
  - '&7&oMașină'
STB_SCURELAY:
  description:
  - '&7Se conectează la alt Releu SCU pentru a împărți'
  - '&7o încărcare comună la orice distanță.'
  name: '&fReleu SCU'
  stats:
  - '&8⇨ &e⚡ &7100000 SCU'
  type:
  - '&7&oMașină'
STB_SENDERMODULE:
  description:
  - '&7Se montează într-un Router de Obiecte pentru a trimite obiecte'
  - '&7într-un inventar adiacent sau către un router'
