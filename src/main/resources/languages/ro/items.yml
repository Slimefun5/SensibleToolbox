  type:
  - '&7&oComponentă'
  usage:
  - '&eClic stânga&7 pe un bloc pentru a seta direcția'
  - '&eGhemuit + Clic stânga&7 în aer pentru a anula direcția'
STB_SILICONWAFER:
  description:
  - '&7Folosită la fabricarea circuitelor electronice'
  - '&7mai avansate.'
  name: '&fPlachetă de Siliciu'
  type:
  - '&7&oComponentă'
STB_SILKYBREAKERMODULE:
