  - '&7&oStroj'
  usage:
  - '&ePravý klik&7 otvorí nastavenia'
STB_SPEEDMODULE:
  description:
  - '&7Pasívny modul, ktorý zvyšuje rýchlosť'
  - '&7smerovača. 0 modulov = 1 operácia / 20 tikov;'
  - '&71 = 1/15, 2 = 1/10, 3 = 1/5. Nad 3 sa ignorujú.'
  name: '&fModul P.S.: Vylepšenie rýchlosti'
  type:
  - '&7&oKomponent'
STB_SPEEDUPGRADE:
  description:
  - '&7Vloží sa do stroja, aby bežal'
  - '&7rýchlejšie za cenu vyššej spotreby energie.'
  name: '&fVylepšenie rýchlosti'
  stats:
  - '&8⇨ &7Rýchlosť: &ex1.4'
  - '&8⇨ &7Spotreba energie: &ex1.6'
  type:
  - '&7&oKomponent'
STB_STACKMODULE:
  description:
  - '&7Pasívny modul; každý zdvojnásobí počet'
  - '&7predmetov presunutých za operáciu, až po'
  - '&7maximálnu veľkosť hŕby. Nad 6 sa ignorujú.'
