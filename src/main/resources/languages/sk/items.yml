  type:
  - '&7&oNástroj'
  usage:
  - '&ePravý klik&7 na hlinu/trávu zorie plochu 3x3'
  - '&ePravý klik&7 na ornú pôdu zaseje plochu 3x3'
  - '&ePravý klik&7 inde otvorí vrecko na semená'
  - '&eĽavý klik&7 na rastliny zozbiera plochu 3x3'
  - '&eĽavý klik&7 na lístie rozbije plochu 3x3x3'
