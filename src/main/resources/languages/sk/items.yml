  name: '&fVylepšenie dôkladnosti'
  stats:
  - '&8⇨ &7Rýchlosť: &ex0.7'
  - '&8⇨ &7Spotreba energie: &ex1.6'
  - '&8⇨ &7Bonusový výstup: &e+8%'
  type:
  - '&7&oKomponent'
STB_TOUGHMACHINEFRAME:
  description:
  - '&7Používa sa pri výrobe niektorých'
  - '&7pokročilejších strojov.'
