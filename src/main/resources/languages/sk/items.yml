  - '&7Hodvábnym dotykom rozbije blok v nastavenom'
  - '&7smere a vtiahne ho do smerovača.'
  - '&7Musí sa vyrobiť s knihou Hodvábny dotyk.'
  name: '&fModul P.S.: Hodvábny rozbíjač'
  type:
  - '&7&oKomponent'
  usage:
  - '&eĽavý klik&7 na blok určí smer'
  - '&ePrikrčenie + ľavý klik&7 do vzduchu zruší smer'
STB_SIMPLECIRCUIT:
  description:
  - '&7Používa sa ako komponent v rôznych strojoch.'
  name: '&fJednoduchý elektronický obvod'
