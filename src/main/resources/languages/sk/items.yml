  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oStroj'
STB_TENKENERGYCELL:
  description:
  - '&7Prenosný energetický článok, ktorý nesie uloženú'
  - '&7energiu STB na nabíjanie zariadení za pochodu.'
