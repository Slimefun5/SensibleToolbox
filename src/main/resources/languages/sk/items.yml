  - '&7Pasívny modul, ktorý prijíma predmety'
  - '&7z otočeného odosielacieho modulu alebo z prepojeného'
  - '&7pokročilého odosielacieho modulu.'
  name: '&fModul P.S.: Prijímač'
  type:
  - '&7&oKomponent'
STB_RECIPEBOOK:
  description:
  - '&7Umožňuje prehliadať a vyrábať všetky'
  - '&7známe recepty.'
  name: '&fKniha receptov'
  type:
  - '&7&oGadget'
STB_REDSTONECLOCK:
  description:
  - '&7Hodiny v bloku. Vysielajú redstone'
  - '&7signál s nastaviteľným intervalom & trvaním.'
  name: '&fRedstone hodiny'
  type:
  - '&7&oStroj'
  usage:
  - '&ePravý klik&7 na blok nastaví hodiny'
STB_REGULATORUPGRADE:
  description:
  - '&7Dodáva strojom inteligenciu na účinnejšie'
  - '&7využitie surovín. Účinok sa líši'
  - '&7podľa stroja.'
  name: '&fVylepšenie regulátora'
  type:
  - '&7&oKomponent'
STB_SAWMILL:
  description:
  - '&7Spracúva drevené predmety na dosky'
  - '&7s vyšším výťažkom ako pri výrobe.'
  name: '&fPíla'
  type:
  - '&7&oStroj'
STB_SCURELAY:
  description:
  - '&7Prepája sa s iným SCU relé a zdieľa'
  - '&7spoločný náboj na akúkoľvek vzdialenosť.'
  name: '&fSCU relé'
  stats:
  - '&8⇨ &e⚡ &7100000 SCU'
  type:
  - '&7&oStroj'
STB_SENDERMODULE:
  description:
  - '&7Vkladá sa do predmetového smerovača a posiela predmety'
  - '&7do susedného inventára alebo do smerovača'
  - '&7s prijímacím modulom do 10 blokov'
  - '&7v priamom dohľade.'
  name: '&fModul P.S.: Odosielač'
  type:
  - '&7&oKomponent'
  usage:
  - '&eĽavý klik&7 na blok určí smer'
  - '&ePrikrčenie + ľavý klik&7 do vzduchu zruší smer'
STB_SILICONWAFER:
  description:
  - '&7Používa sa pri výrobe pokročilejších'
  - '&7elektronických obvodov.'
