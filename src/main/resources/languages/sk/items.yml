  - '&7&oKomponent'
STB_SMELTER:
  description:
  - '&7Taví predmety ako pec, ale'
  - '&7rýchlejšie a účinnejšie.'
  name: '&fTaviareň'
  type:
  - '&7&oStroj'
STB_SORTERMODULE:
  description:
  - '&7Vkladá sa do predmetového smerovača a ukladá predmety'
  - '&7do inventára len vtedy, ak je prázdny alebo'
  - '&7už taký predmet obsahuje.'
  name: '&fModul P.S.: Triedič'
  type:
  - '&7&oKomponent'
  usage:
  - '&eĽavý klik&7 na blok určí smer'
  - '&ePrikrčenie + ľavý klik&7 do vzduchu zruší smer'
STB_SOUNDMUFFLER:
