STB_SCURELAY:
  description:
  - '&7Länkar till ett annat SCU-relä för att dela'
  - '&7en gemensam laddning över valfritt avstånd.'
  name: 'SCU-relä'
  stats:
  - '&8⇨ &e⚡ &7100000 SCU'
  type:
  - '&7&oMaskin'
STB_SENDERMODULE:
  description:
  - '&7Sätts i en föremålsrouter för att skicka föremål'
  - '&7till ett intilliggande inventarie, eller till en router'
  - '&7med en mottagarmodul inom 10 block'
  - '&7med fri sikt.'
  name: 'F.R.-mod: Sändare'
  type:
  - '&7&oKomponent'
  usage:
  - '&eVänsterklicka&7 på ett block för att ställa riktningen'
  - '&eSmyg + vänsterklicka&7 i luften för att nollställa riktningen'
STB_SILICONWAFER:
  description:
  - '&7Används vid tillverkning av mer avancerade'
  - '&7elektroniska kretsar.'
  name: 'Kiselskiva'
  type:
  - '&7&oKomponent'
STB_SILKYBREAKERMODULE:
  description:
  - '&7Bryter blocket med silkesberöring i sin inställda'
  - '&7riktning och drar in det i routern.'
  - '&7Måste tillverkas med en bok med silkesberöring.'
  name: 'F.R.-mod: Silkesbrytare'
  type:
  - '&7&oKomponent'
  usage:
  - '&eVänsterklicka&7 på ett block för att ställa riktningen'
  - '&eSmyg + vänsterklicka&7 i luften för att nollställa riktningen'
STB_SIMPLECIRCUIT:
  description:
  - '&7Används som komponent i olika maskiner.'
  name: 'Enkel elektronisk krets'
  type:
  - '&7&oKomponent'
STB_SMELTER:
  description:
  - '&7Smälter föremål som en ugn, men'
  - '&7snabbare och effektivare.'
  name: 'Smältare'
  type:
  - '&7&oMaskin'
STB_SORTERMODULE:
  description:
  - '&7Sätts i en föremålsrouter för att lägga föremål'
  - '&7i ett inventarie endast om det är tomt eller'
  - '&7redan innehåller det föremålet.'
  name: 'F.R.-mod: Sorterare'
  type:
  - '&7&oKomponent'
  usage:
  - '&eVänsterklicka&7 på ett block för att ställa riktningen'
  - '&eSmyg + vänsterklicka&7 i luften för att nollställa riktningen'
STB_SOUNDMUFFLER:
  description:
  - '&7Sänker volymen på alla ljud'
  - '&7inom en radie på 8 block.'
  name: 'Ljuddämpare'
  type:
  - '&7&oMaskin'
  usage:
  - '&eHögerklicka&7 för att öppna inställningarna'
STB_SPEEDMODULE:
  description:
  - '&7En passiv modul som ökar routerns'
  - '&7hastighet. 0 moduler = 1 operation / 20 tick;'
  - '&71 = 1/15, 2 = 1/10, 3 = 1/5. Över 3 ignoreras.'
  name: 'F.R.-mod: Hastighetsuppgradering'
  type:
  - '&7&oKomponent'
STB_SPEEDUPGRADE:
  description:
  - '&7Placeras i en maskin för att få den att gå'
  - '&7snabbare, till priset av högre kraftförbrukning.'
  name: 'Hastighetsuppgradering'
  stats:
  - '&8⇨ &7Hastighet: &ex1.4'
  - '&8⇨ &7Kraftförbrukning: &ex1.6'
  type:
  - '&7&oKomponent'
STB_STACKMODULE:
  description:
  - '&7En passiv modul; varje modul fördubblar antalet'
  - '&7föremål som flyttas per operation, upp till'
  - '&7föremålets maximala stackstorlek. Över 6 ignoreras.'
  name: 'F.R.-mod: Stackuppgradering'
  type:
  - '&7&oKomponent'
STB_SUBSPACETRANSPONDER:
  description:
  - '&7Används av vissa avancerade föremål för'
  - '&7kommunikation mellan världar.'
  name: 'Subrymdstransponder'
  type:
  - '&7&oKomponent'
STB_TAPEMEASURE:
  description:
  - '&7Mäter avståndet mellan två'
  - '&7punkter du väljer i världen.'
  name: 'Måttband'
  type:
  - '&7&oVerktyg'
  usage:
  - '&eSmyg + högerklicka&7 på ett block för att sätta fästpunkten'
  - '&eHögerklicka&7 på ett block för att få måttet'
STB_TENKBATTERYBOX:
  description:
  - '&7Lagrar energi för att buffra kraft mellan'
  - '&7generatorer och maskiner.'
  name: '10K-batterilåda'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oMaskin'
STB_TENKENERGYCELL:
  description:
  - '&7En bärbar energicell som bär lagrad'
  - '&7STB-kraft för att ladda apparater under färd.'
  name: '10K-energicell'
  stats:
  - '&8⇨ &e⚡ &710000 SCU'
  type:
  - '&7&oKomponent'
STB_THOROUGHNESSUPGRADE:
  description:
  - '&7Placeras i en maskin för att öka användbar'
  - '&7utgång, till priset av hastighet och kraft.'
  name: 'Noggrannhetsuppgradering'
  stats:
  - '&8⇨ &7Hastighet: &ex0.7'
  - '&8⇨ &7Kraftförbrukning: &ex1.6'
  - '&8⇨ &7Bonusutgång: &e+8%'
  type:
  - '&7&oKomponent'
STB_TOUGHMACHINEFRAME:
  description:
  - '&7Används vid tillverkning av vissa mer'
  - '&7avancerade maskiner.'
  name: 'Tålig maskinram'
  type:
  - '&7&oKomponent'
STB_TRASHCAN:
  description:
  - '&7FÖRSTÖR alla föremål som läggs eller leds'
  - '&7in i den. Var försiktig!'
  name: 'Soptunna'
  type:
  - '&7&oMaskin'
STB_UNLINKEDSCURELAY:
  description:
  - '&7Tillverka två av dessa tillsammans för att länka'
  - '&7dem till ett SCU-relä med delad laddning.'
  name: 'Olänkat SCU-relä'
  type:
  - '&7&oKomponent'
STB_VACUUMMODULE:
  description:
  - '&7Sätts i en föremålsrouter för att suga upp'
  - '&7närliggande tappade föremål.'
  name: 'F.R.-mod: Dammsugare'
  stats:
  - '&8⇨ &7Radie: &e6 block'
  type:
  - '&7&oKomponent'
STB_WATERINGCAN:
  description:
  - '&7Vattnar och får närliggande grödor att växa.'
  - '&7Använd den inte för mycket!'
  name: 'Vattenkanna'
  type:
  - '&7&oVerktyg'
  usage:
  - '&eHögerklicka&7 för att vattna grödor'
  - '&eHögerklicka&7 i vatten för att fylla på'
STB_WOODCOMBINEHOE:
  description:
  - '&7En mångsidig trädgårdshacka som plöjer, sår och'
  - '&7skördar, med inbyggd fröväska.'
  name: 'Kombinerad trädgårdshacka av trä'
  type:
  - '&7&oVerktyg'
  usage:
  - '&eHögerklicka&7 på jord/gräs för att plöja ett 3x3-område'
  - '&eHögerklicka&7 på åkermark för att så ett 3x3-område'
  - '&eHögerklicka&7 någon annanstans för att öppna fröväskan'
  - '&eVänsterklicka&7 på växter för att skörda ett 3x3-område'
  - '&eVänsterklicka&7 på löv för att bryta ett 3x3x3-område'
